<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Perk pass check — PunchCard</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="PunchCard">
<meta property="og:url" content="https://punchcard.club/pass/">
<meta property="og:title" content="PunchCard perk pass">
<meta property="og:description" content="Staff check a holder&#x27;s perk pass, live.">
<meta property="og:image" content="https://punchcard.club/og/pass.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="PunchCard perk pass">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PunchCard perk pass">
<meta name="twitter:description" content="Staff check a holder&#x27;s perk pass, live.">
<meta name="twitter:image" content="https://punchcard.club/og/pass.png">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c1812">
<link rel="icon" href="/brand/punchcard.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  body { background: #1c1812; color: #f6efe2; min-height: 100dvh; }
  .chk { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 1rem) 1.1rem calc(env(safe-area-inset-bottom, 0px) + 1.5rem); display: grid; gap: 1rem; }
  .chk-brand { display: flex; align-items: center; gap: .5rem; font-family: 'Special Elite', cursive; font-size: 1.2rem; }
  .chk-brand b { color: #e8876a; font-weight: 400; }
  .chk-brand small { margin-left: auto; font-family: 'Courier Prime', monospace; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: rgba(246,239,226,.6); }
  .verdict { border-radius: 22px; padding: 1.6rem 1.2rem; text-align: center; display: grid; gap: .5rem; justify-items: center; transition: background .3s; }
  .verdict svg { width: 64px; height: 64px; }
  .verdict .word { font-family: 'Special Elite', cursive; font-size: clamp(2.6rem, 14vw, 3.6rem); line-height: 1; }
  .verdict .why { font-size: 1rem; opacity: .9; }
  .v-valid { background: #3d5a4a; box-shadow: 0 0 0 4px rgba(147,194,164,.35); animation: pulse 2s ease-in-out infinite; }
  .v-invalid { background: #a83a20; }
  .v-redeemed { background: linear-gradient(135deg, #f7d774, #c9881e); color: #3d2400; }
  .v-wait { background: #2a241b; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(147,194,164,.12); } }
  .info { border-radius: 16px; background: #2a241b; padding: 1rem 1.1rem; display: grid; gap: .55rem; }
  .info .biz { font-family: 'Lora', serif; font-size: 1.05rem; color: rgba(246,239,226,.8); }
  .info .perk { font-family: 'Special Elite', cursive; font-size: 1.6rem; line-height: 1.15; }
  .info .row { display: flex; justify-content: space-between; gap: .5rem; font-size: .9rem; color: rgba(246,239,226,.75); }
  .info .row b { color: #f6efe2; }
  .clock { font-family: 'Courier Prime', monospace; font-size: 2rem; text-align: center; letter-spacing: .08em; }
  .redeem { width: 100%; min-height: 3.6rem; font-size: 1.1rem; font-weight: 700; }
  .note { font-size: .8rem; color: rgba(246,239,226,.55); text-align: center; line-height: 1.5; margin: 0; }
  @media (prefers-reduced-motion: reduce) { .v-valid { animation: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="chk">
  <div class="chk-brand"><img src="/brand/punchcard.svg" alt="" width="28" height="28"><span>Punch<b>Card</b></span><small>Perk pass check</small></div>
  <div class="verdict v-wait" id="verdict" role="status" aria-live="polite"><div class="word">Checking…</div></div>
  <div class="info" id="info" hidden>
    <div class="biz" id="biz"></div>
    <div class="perk" id="perk"></div>
    <div class="row"><span>Holder</span><b class="mono" id="who"></b></div>
    <div class="row"><span>Holds</span><b id="holds"></b></div>
    <div class="row"><span>Pass</span><b id="left"></b></div>
  </div>
  <div class="clock" id="clock" aria-label="Live clock">--:--:--</div>
  <button class="btn-primary sol redeem" id="redeem" type="button" hidden></button>
  <p class="note">This page asks PunchCard live. A screenshot or an expired pass shows NOT VALID. One-time perks are marked used when redeemed.</p>
</main>
<script type="module">
import { API, esc, short } from '/launchpad/lp.js';
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id') || '';
const ICON = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>',
  no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8.5 8.5 7 7m0-7-7 7"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7Z"/></svg>',
};
let pass = null, skew = 0;
const pad = (n) => String(n).padStart(2, '0');
function render() {
  const v = $('verdict');
  if (!pass) return;
  $('info').hidden = false;
  $('biz').textContent = pass.business; $('perk').textContent = pass.perk;
  $('who').textContent = short(pass.wallet); $('holds').textContent = `$${Number(pass.holdingsUsd || 0).toFixed(2)} of ${pass.ticker}`;
  if (pass.redeemedAt) {
    v.className = 'verdict v-redeemed';
    v.innerHTML = `${ICON.star}<div class="word">Redeemed</div><div class="why">${new Date(pass.redeemedAt * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} · enjoy!</div>`;
    $('redeem').hidden = true; return;
  }
  if (pass.valid) {
    v.className = 'verdict v-valid';
    v.innerHTML = `${ICON.ok}<div class="word">Valid</div><div class="why">Holder confirmed just now</div>`;
    $('redeem').hidden = !pass.oneTime; $('redeem').textContent = `Redeem: ${pass.perk}`;
  } else {
    v.className = 'verdict v-invalid';
    v.innerHTML = `${ICON.no}<div class="word">Not valid</div><div class="why">${esc(pass.reason || 'This pass can’t be used')}</div>`;
    $('redeem').hidden = true;
  }
}
async function check() {
  if (!/^[0-9a-f]{32}$/.test(id)) { $('verdict').className = 'verdict v-invalid'; $('verdict').innerHTML = `${ICON.no}<div class="word">Not valid</div><div class="why">This isn’t a PunchCard pass.</div>`; return; }
  try {
    const r = await fetch(`${API}/api/perks/pass/${id}`), j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Not found');
    pass = j; skew = j.serverTime - Math.floor(Date.now() / 1000); render();
  } catch (e) { $('verdict').className = 'verdict v-invalid'; $('verdict').innerHTML = `${ICON.no}<div class="word">Not valid</div><div class="why">${esc(e.message)}</div>`; }
}
$('redeem').addEventListener('click', async () => {
  $('redeem').disabled = true; $('redeem').textContent = 'Redeeming…';
  try {
    const r = await fetch(`${API}/api/perks/pass/${id}/redeem`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }), j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Could not redeem');
    pass = j; try { navigator.vibrate?.([20, 40, 30]); } catch {} render();
  } catch (e) { await check(); if (!pass?.redeemedAt) { $('verdict').querySelector('.why') && ($('verdict').querySelector('.why').textContent = e.message); } }
  finally { $('redeem').disabled = false; }
});
setInterval(() => {
  const d = new Date(); $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  if (pass && pass.redeemedAt) $('left').textContent = 'used';
  if (pass && !pass.redeemedAt) { const left = pass.expiresAt - (Math.floor(Date.now() / 1000) + skew); $('left').textContent = left > 0 ? `valid for ${Math.floor(left / 60)}:${pad(left % 60)}` : 'expired'; }
}, 250);
check(); setInterval(() => { if (!pass?.redeemedAt) check(); }, 8000);
</script>
</body>
</html>
