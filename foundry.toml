[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"

# Required, not optional. TokenFactory.deploy() exhausts the stack without the IR
# pipeline ("Stack too deep"). Whatever settings are used here must also be used when
# verifying on Basescan, or the verification will not match.
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
