[profile.default]
# Read-only access to the deploy scripts, so DeploymentInvariants.t.sol can assert things
# about them that no Solidity test could otherwise reach — chiefly that every script
# creating a WindDownController demands explicit acknowledgement first.
fs_permissions = [
    { access = "read",       path = "./script" },
    { access = "read",       path = "./contracts" },
    # StageMerchant writes stage 1's addresses here and reads them back in stages 2 and 3,
    # so an operator does not retype a token address between transactions.
    { access = "read-write", path = "./deploy/staged" },
]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"

# Required, not optional. TokenFactory.deploy() exhausts the stack without the IR
# pipeline ("Stack too deep"). Whatever settings are used here must also be used when
# verifying on Basescan, or the verification will not match.
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[invariant]
runs = 256
depth = 64
# The handler computes each action's achievable range before bounding, so a revert now
# means something genuinely unexpected rather than an unmet precondition. Leaving this
# false let real failures hide among the noise.
fail_on_revert = true
