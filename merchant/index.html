<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PunchCard Merchant</title>
<meta name="description" content="For business owners on PunchCard: your creator fees, your token and your perks, in one place.">
<meta name="theme-color" content="#17130e">
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/punchcard.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Lora:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<link rel="manifest" href="/merchant/manifest.webmanifest">
<link rel="apple-touch-icon" href="/go/apple-touch-icon.png">
<script src="https://unpkg.com/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>
<style>
  body { background: var(--paper); min-height: 100dvh; }
  .m-top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: calc(.7rem + env(safe-area-inset-top, 0px)) 1rem .7rem; background: #17130e; color: #f6efe2; }
  .m-brand { display: flex; align-items: center; gap: .5rem; color: #f6efe2; text-decoration: none; font-family: 'Special Elite', cursive; font-size: 1.1rem; }
  .m-brand small { font-family: 'Courier Prime', monospace; font-size: .62rem; letter-spacing: .16em; color: #f4d9a7; text-transform: uppercase; }
  .m-switch { display: flex; align-items: center; gap: .45rem; padding: .35rem .7rem .35rem .4rem; border-radius: 999px; background: rgba(246,239,226,.1); border: 1px solid rgba(246,239,226,.18); color: #f6efe2; font: inherit; font-size: .85rem; }
  .m-switch img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #fff; }
  .m-wrap { max-width: 560px; margin: 0 auto; padding: 1rem 1rem calc(5.5rem + env(safe-area-inset-bottom, 0px)); display: grid; gap: 1rem; }
  .m-hello { display: grid; gap: .2rem; }
  .m-hello p { margin: 0; color: var(--ink-mid); font-size: .9rem; }
  .m-hello h1 { margin: 0; font-family: 'Special Elite', cursive; font-weight: 400; font-size: 1.7rem; line-height: 1.1; }
  .m-card { border-radius: 18px; background: var(--paper-card); border: 1px solid var(--border-mid); padding: 1rem 1.1rem; display: grid; gap: .7rem; }
  .m-card.dark { background: #17130e; color: #f6efe2; border-color: #17130e; }
  .m-label { margin: 0; font-family: 'Courier Prime', monospace; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--terra); }
  .m-card.dark .m-label { color: #f4d9a7; }
  .m-big { font-family: 'Special Elite', cursive; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .m-big small { font-family: 'Inter', sans-serif; font-size: .9rem; color: rgba(246,239,226,.7); margin-left: .3rem; }
  .m-sub { margin: 0; font-size: .88rem; color: var(--ink-mid); line-height: 1.5; }
  .m-card.dark .m-sub { color: rgba(246,239,226,.72); }
  .m-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
  .m-stat { border-radius: 12px; padding: .6rem .7rem; background: rgba(246,239,226,.07); border: 1px solid rgba(246,239,226,.12); display: grid; gap: .1rem; }
  .m-stat b { font-variant-numeric: tabular-nums; font-size: 1.05rem; overflow-wrap: anywhere; }
  .m-stat span { font-size: .72rem; color: rgba(246,239,226,.65); }
  .m-card:not(.dark) .m-stat { background: var(--paper); border-color: var(--border); }
  .m-card:not(.dark) .m-stat span { color: var(--ink-mid); }
  .m-row { display: flex; align-items: center; justify-content: space-between; gap: .8rem; }
  .m-pill { padding: .2rem .6rem; border-radius: 999px; font-size: .72rem; font-weight: 600; background: var(--sol-pale); color: var(--sol); white-space: nowrap; }
  .m-pill.warm { background: var(--terra-pale); color: var(--terra); }
  .m-pill.paused { background: var(--paper-warm); color: var(--ink-faded); }
  .m-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
  .m-perk { border-radius: 14px; border: 1px solid var(--border-mid); background: var(--paper); padding: .8rem .9rem; display: grid; gap: .35rem; }
  .m-perk b { font-family: 'Lora', serif; font-size: 1.05rem; }
  .m-perk p { margin: 0; font-size: .86rem; color: var(--ink-mid); line-height: 1.45; }
  .m-perk .meta { display: flex; flex-wrap: wrap; gap: .35rem; }
  .m-perk .acts { display: flex; gap: .5rem; margin-top: .2rem; }
  .m-btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .7rem 1.1rem; border-radius: 999px; border: 0; background: var(--sol); color: #fff; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .m-btn.gold { background: #f4d9a7; color: #17130e; }
  .m-btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--border-mid); padding: .45rem .9rem; font-size: .85rem; }
  .m-btn.wide { width: 100%; }
  .m-field { display: grid; gap: .3rem; }
  .m-field label { font-weight: 600; font-size: .88rem; }
  .m-field small { color: var(--ink-mid); font-size: .78rem; }
  .m-field input, .m-field textarea, .m-field select { font: inherit; padding: .65rem .75rem; border-radius: 10px; border: 1px solid var(--border-mid); background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; }
  .m-field textarea { min-height: 4.5rem; resize: vertical; }
  .m-seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: .4rem; }
  .m-seg label { display: grid; gap: .1rem; padding: .6rem .7rem; border-radius: 12px; border: 1.5px solid var(--border-mid); background: #fff; font-weight: 600; font-size: .88rem; cursor: pointer; }
  .m-seg label small { font-weight: 400; color: var(--ink-mid); font-size: .74rem; }
  .m-seg input { display: none; }
  .m-seg label:has(input:checked) { border-color: var(--sol); background: var(--sol-pale); }
  .m-toggle { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .m-sw { position: relative; width: 48px; height: 28px; flex: none; border-radius: 999px; background: var(--sol); }
  .m-sw::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; }
  .m-sw.off { background: var(--border-mid); } .m-sw.off::after { right: auto; left: 3px; }
  .m-tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; z-index: 10; margin: 0; border-bottom: 0; backdrop-filter: none; display: grid; grid-template-columns: repeat(3, 1fr); background: #fffdf8; border-top: 1px solid var(--border-mid); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .m-tabs a { display: grid; justify-items: center; gap: .15rem; padding: .55rem 0 .6rem; color: var(--ink-faded); text-decoration: none; font-size: .74rem; font-weight: 600; }
  .m-tabs a.on { color: var(--terra); }
  .m-tabs svg { width: 22px; height: 22px; }
  .m-pay { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .8rem; padding: .55rem 0; border-top: 1px dashed var(--border); font-size: .88rem; }
  .m-pay:first-child { border-top: 0; }
  .m-pay b { font-variant-numeric: tabular-nums; }
  .m-pay span { color: var(--ink-mid); font-size: .78rem; }
  .m-signin { min-height: 80dvh; display: grid; align-content: center; gap: 1.1rem; text-align: center; }
  .m-signin h1 { margin: 0; font-family: 'Special Elite', cursive; font-weight: 400; font-size: 2.1rem; line-height: 1.05; }
  .m-signin p { margin: 0; color: var(--ink-mid); line-height: 1.55; }
  .m-price { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; }
  .m-price b { font-family: 'Special Elite', cursive; font-weight: 400; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
  .m-chg { font-weight: 700; font-variant-numeric: tabular-nums; }
  .m-chg small { font-weight: 400; color: var(--ink-mid); font-size: .78rem; }
  .m-chg.up { color: var(--sol); } .m-chg.down { color: var(--terra); }
  .m-tabs[hidden], .m-switch[hidden], [hidden] { display: none !important; }
  .m-msg { padding: .8rem 1rem; border-radius: 12px; background: var(--terra-pale); color: var(--terra); font-size: .9rem; line-height: 1.45; }
  .m-msg.ok { background: var(--sol-pale); color: var(--sol); }
  .m-tokens { display: grid; gap: .5rem; }
  .m-tokens button { display: flex; align-items: center; gap: .7rem; padding: .7rem .8rem; border-radius: 14px; border: 1px solid var(--border-mid); background: var(--paper-card); font: inherit; text-align: left; cursor: pointer; }
  .m-tokens img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
  .m-review { display: grid; gap: .3rem; padding: .8rem 1rem; border-radius: 14px; background: rgba(244,217,167,.12); border: 1px solid rgba(244,217,167,.3); }
  .m-review b { color: #f4d9a7; }
  .m-busy { opacity: .6; pointer-events: none; }
  .m-switch select { background: transparent; color: #f6efe2; border: 0; font: inherit; font-weight: 600; max-width: 9rem; }
  .m-switch select option { color: #1c1812; }
</style>
</head>
<body>
<header class="m-top">
  <a class="m-brand" href="/merchant/"><img src="/brand/punchcard.svg" alt="" width="26" height="26"><span>Merchant<br><small>PunchCard</small></span></a>
  <div class="m-switch" id="switch" hidden><img id="switchImg" src="/brand/punchcard.svg" alt=""><select id="tokenSel" aria-label="Your token"></select></div>
</header>
<main class="m-wrap" id="app" aria-live="polite"></main>
<nav class="m-tabs" id="tabs" hidden>
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Overview</a>
  <a href="#fees" data-tab="fees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5c0-1 1.1-1.8 2.5-1.8s2.5.8 2.5 1.8-1 1.5-2.5 1.5-2.5.6-2.5 1.6 1.1 1.7 2.5 1.7 2.5-.7 2.5-1.7"/></svg>Fees</a>
  <a href="#perks" data-tab="perks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M3 11h18M8 7V5M16 7V5"/><circle cx="7" cy="15" r="1"/><circle cx="11" cy="15" r="1"/></svg>Perks</a>
</nav>
<script type="module" src="/merchant/app.js"></script>
</body>
</html>
